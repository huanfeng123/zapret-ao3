name: Build AO3 Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "general (AO3).bat"
      - "lists/**"
      - "utils/**"
      - "service.bat"
      - ".service/version.txt"
      - "README-AO3-ZH.md"
      - "tests/**"
      - ".github/workflows/ao3-package.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check AO3 support files
        shell: pwsh
        run: ./tests/ao3-support.ps1

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create one ZIP archive
        run: |
          mkdir zapret-ao3-windows
          cp -r bin lists utils .service zapret-ao3-windows/
          cp ./*.bat LICENSE.txt README.md README-AO3-ZH.md zapret-ao3-windows/
          zip -qr zapret-ao3-windows.zip zapret-ao3-windows

      - name: Upload AO3 package
        uses: actions/upload-artifact@v4
        with:
          name: zapret-ao3-windows
          path: zapret-ao3-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.10.0-ao3.1
          name: Zapret AO3 1.10.0-ao3.1
          body: Windows AO3 bypass package based on Flowseal zapret-discord-youtube 1.10.0.
          files: zapret-ao3-windows.zip
          make_latest: true
